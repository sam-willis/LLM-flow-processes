[project]
name = "neural-diffusion-processes"
version = "0.1.0"
description = "LLM Flow Processes for text-conditioned regression."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sam Willis", email = "samuel.willis@secondmind.ai" },
    { name = "Felix Biggs", email = "felix.biggs@wayve.ai" },
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "jax[cuda]>=0.4.34,<0.5",
    "hydra-core>=1.3.2,<2",
    "optax>=0.2.3,<0.3",
    "diffrax>=0.6.0,<0.7",
    "einops>=0.8.0,<0.9",
    "pandas>=2.2.3,<3",
    "numpy>=1.26.4,<2",
    "equinox>=0.11.8,<0.12",
    "check-shapes>=1.1.1,<2",
    "tensorflow>=2.16.0,<2.17.0",
    "tensorflow-probability>=0.24.0,<0.25",
    "jupytext>=1.16.4,<2",
    "notebook>=7.2.2,<8",
    "gpflow>=2.9.2,<3",
    "pygls>=1.3.1,<2",
    "tensorflow-recommenders==0.7.2",
    "llm-processes @ git+https://github.com/sam-willis/llm_processes.git",
    "flax>=0.10.2,<0.11",
    "aim>=3.28.0,<4",
    "plotly>=6.0.1,<7",
    "wandb>=0.21.3,<0.22",
    "kaleido>=1.1.0,<2",
    "nvitop>=1.6.2",
    "lm-format-enforcer>=0.10,<0.12",
    # PyPI serves CPU-only torch on linux aarch64; GH200/Grace needs CUDA wheels from PyTorch.
    "torch==2.10.0+cu128",
    "cik-benchmark",
    # setuptools<80 still ships pkg_resources, which old pytorch-lightning
    # (2.1.4, pulled by lag-llama) still imports at module load.
    "setuptools>=75,<80",
    "flash-linear-attention",
    "py-spy>=0.4.1",
    "xgrammar>=0.2.0,<0.2.4",
    "click>=8.1,<9",
    "omegaconf>=2.3,<3",
    "transformers>=5.5,<6",
    "matplotlib>=3.7.0,<4",
    "tqdm>=4.64.1,<5",
]

[project.optional-dependencies]
# CUDA kernel libraries for optimised Qwen3.5/3.6 linear-attention inference.
# No pre-built aarch64 wheels; these build from source, so nvcc must be on PATH.
cuda-kernels = [
    "causal-conv1d",
    "flash-linear-attention",
]

[dependency-groups]
dev = [
    "ruff>=0.14.1,<0.15",
    "mypy>=1.7.1,<2",
    "pytest>=7.2.1,<8",
    "black>=23.1.0,<24",
    "isort>=5.12.0,<6",
    "taskipy>=1.10.3,<2",
    "ipython>=8.10.0,<9",
    "ipykernel>=6.21.2,<7",
    "types-tqdm>=4.66.0.5,<5",
]

[tool.uv]
# Force our fork of llm-processes across all transitive requests
# (cik-benchmark pins aldro61/master).
override-dependencies = [
    "llm-processes @ git+https://github.com/sam-willis/llm_processes.git",
    # cik_benchmark.__init__ eagerly imports lag_llama (via window_selection),
    # which uses gluonts 0.14's torch.modules.loss API. Keep gluonts on the
    # old API to unblock the import chain.
    "gluonts[torch]==0.14.4",
    # gluonts 0.14 pins pandas<2.2, but we need 2.2.3+ elsewhere. Force our
    # pandas version; gluonts 0.14 works with pandas 2.2 at runtime in
    # practice (the <2.2 pin is conservative).
    "pandas>=2.2.3,<3",
]

# cik-benchmark's baselines (TACTiS, lag-llama, chronos, uni2ts, TimeLLM,
# UniTime) each pin old versions of torch/numpy/pandas/einops/hydra/etc
# that clash with the CUDA torch 2.10 + modern-ML stack above. We never
# instantiate those baselines, so we tell uv to skip their
# transitive-requirement resolution entirely. The
# packages still get installed from the URLs cik-benchmark specifies; they
# just come with no deps forced on us. Any attempt to import those
# baselines at runtime will fail - by design.
[[tool.uv.dependency-metadata]]
name = "uni2ts"
version = "2.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "lag-llama"
version = "0.1.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "tactis"
version = "0.1.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "chronos-forecasting"
version = "1.0.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "timellm"
version = "0.1.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "unitime"
version = "0.1.0"
requires-dist = []

[tool.uv.sources]
jaxlib = { index = "jax-cuda-releases" }
jax-cuda12-plugin = { index = "jax-cuda-releases" }
torch = { index = "pytorch-cu128" }
cik-benchmark = { git = "https://github.com/ServiceNow/context-is-key-forecasting" }

[[tool.uv.index]]
name = "jax-cuda-releases"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neural_diffusion_processes"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.taskipy.tasks]
format = """
    isort neural_diffusion_processes tests
    black neural_diffusion_processes tests
"""
lint = """
    echo ============Ruff=============
    ruff check neural_diffusion_processes tests
    echo ============Isort=============
	isort neural_diffusion_processes tests --check-only --df
    echo ============Black=============
	black neural_diffusion_processes tests --check --diff
"""
test = "pytest tests"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
ignore = ["F722"]

[tool.ruff.per-file-ignores]
'neural_diffusion_processes/__init__.py' = ['F401']
